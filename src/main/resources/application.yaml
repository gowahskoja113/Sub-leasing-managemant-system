server:
  # Render gán PORT; local mặc định 8080
  port: ${PORT:8080}

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: true

  jpa:
    generate-ddl: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 210MB

app:
  cors:
    allowed-origin-patterns:
      - http://localhost:*
      - http://127.0.0.1:*
      # FE Vercel (production + preview/dev)
      - https://*.vercel.app
      - https://sep-frontend-prod.vercel.app
    allowed-methods:
      - GET
      - POST
      - PUT
      - PATCH
      - DELETE
      - OPTIONS
    allowed-headers:
      - "*"
    exposed-headers:
      - Authorization
      - Date
    allow-credentials: true
    max-age-seconds: 3600
  qr:
    base-url: https://localhost:8080/maintenance/scan
  upload:
    property-images:
      dir: ${PROPERTY_IMAGES_DIR:uploads/properties}
      public-base-url: ${APP_PUBLIC_BASE_URL:http://localhost:8080}

jwt:
  secret: ${JWT_SECRET}
  # 10 ngày = 10 × 24 × 60 × 60 × 1000 (ms). Override bằng JWT_EXPIRATION nếu cần.
  expiration: ${JWT_EXPIRATION:864000000}

# OCR đọc chỉ số điện nước (OCR.space). Đăng ký key free tại https://ocr.space/ocrapi
ocr:
  space:
    base-url: https://api.ocr.space/parse/image
    api-key: ${OCR_SPACE_API_KEY:helloworld}   # 'helloworld' là key demo giới hạn, nên thay bằng key free riêng

# Nhận diện vật thể trên ảnh (Google Cloud Vision + model local ONNX fallback).
# Bật Vision API + tạo API key: https://console.cloud.google.com/apis/library/vision.googleapis.com
# provider: google | local | auto (auto = Google trước, lỗi/timeout/hết quota → local)
vision:
  provider: ${VISION_PROVIDER:auto}
  google:
    base-url: https://vision.googleapis.com/v1/images:annotate
    api-key: ${GOOGLE_VISION_API_KEY:}
    # auto: ~8s để fallback local nhanh; có thể set 30 nếu chỉ dùng google
    timeout-seconds: ${VISION_GOOGLE_TIMEOUT_SECONDS:8}
  local:
    model-path: ${VISION_LOCAL_MODEL_PATH:classpath:models/equipment-mobilenetv3.onnx}
    labels-path: ${VISION_LOCAL_LABELS_PATH:classpath:models/labels.txt}
    min-score: ${VISION_LOCAL_MIN_SCORE:0.35}
    max-results: 10
    # Bắt buộc 1 thread trên VPS 2 core — chừa CPU cho web + PostgreSQL
    intra-op-threads: 1
  max-results: 20
  # Chỉ đếm khi gọi Google (local không tốn quota)
  rate-limit-per-hour: ${VISION_RATE_LIMIT_PER_HOUR:20}
  # Chỉ cho phép ảnh từ domain Cloudinary hệ thống (tránh proxy đọc ảnh ngoài)
  allowed-image-hosts: ${VISION_ALLOWED_IMAGE_HOSTS:res.cloudinary.com}
  # Mô tả hiện trạng phòng (Gemini). Quota tách khỏi /labels. Phí: GEMINI_API_KEY của công ty.
  describe:
    rate-limit-per-hour: ${VISION_DESCRIBE_RATE_LIMIT_PER_HOUR:40}
    max-images: ${VISION_DESCRIBE_MAX_IMAGES:8}
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.0-flash}
    base-url: https://generativelanguage.googleapis.com/v1beta/models
    timeout-seconds: ${VISION_GEMINI_TIMEOUT_SECONDS:30}

# Thanh toán cọc qua PayOS (https://payos.vn). Lấy key ở Dashboard PayOS.
payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  # URL FE/mobile sẽ redirect về sau khi thanh toán (deep link hoặc trang web)
  return-url: ${PAYOS_RETURN_URL:slms://payment-success}
  cancel-url: ${PAYOS_CANCEL_URL:slms://payment-cancel}
  # Sandbox: chia số tiền gửi PayOS (HĐ vẫn ghi số gốc). Production đặt PAYOS_AMOUNT_DIVISOR=1
  amount-divisor: ${PAYOS_AMOUNT_DIVISOR:1000}

# Gửi OTP qua Twilio Verify (https://www.twilio.com/console/verify/services).
twilio:
  account-sid: ${TWILIO_ACCOUNT_SID:}
  auth-token: ${TWILIO_AUTH_TOKEN:}
  verify-service-sid: ${TWILIO_VERIFY_SERVICE_SID:}
  otp:
    expiry-minutes: ${TWILIO_OTP_EXPIRY_MINUTES:5}
    max-attempts: ${TWILIO_OTP_MAX_ATTEMPTS:5}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Cấu hình job nhắc nợ + phí trễ hạn.
# reminderLeadDays / graceDays / meterReminderLeadDays lưu DB (admin sửa qua API, không cần restart).
# Tiền nhà REGULAR: tự gen ngày 1, hạn ngày 5; sau ngày 5 catch-up vẫn OVERDUE.
# Các giá trị yaml dưới đây là fallback / seed khi bảng billing_config chưa có.
billing:
  reminder-days-before: 3
  late-fee-percent: 2
  overdue-renotify-days: 7
  # Legacy tên: KHÔNG còn nhắc/quá hạn/chấm dứt kỳ đầu (QR onboard đã thu FIRST).
  # Không nhầm với graceDays admin (BillingRulesCard).
  first-cycle-grace-days: 3
  rent:
    due-day: 5
    final-reminder-day: 7
    termination-after-days: 3
    # Nhắc trước phát hành (D-N … D-1); N=2 → ngày 30 và 31 khi phát hành mùng 1
    issue-reminder-lead-days: 2

# Bảo trì: tự xác nhận nếu tenant không phản hồi
maintenance:
  auto-confirm-days: 3

# Vòng đời hợp đồng thuê
contract:
  # Cho phép khách nhận nhà sớm tối đa N ngày so với ngày vào ở dự kiến (những ngày sớm được free)
  max-early-move-in-days: 3
  # Quá N ngày kể từ ngày vào ở dự kiến mà HĐ chưa ACTIVE → tự động hủy (no-show)
  no-show-grace-days: 10

# Meter override: admin gen OTP passcode → manager verify 1 lần → overrideToken
manager:
  override:
    # TTL mã admin gen (phút), mặc định 10
    passcode-ttl-minutes: ${MANAGER_OVERRIDE_PASSCODE_TTL_MINUTES:10}
    # TTL overrideToken sau verify (phút), mặc định 15
    ttl-minutes: ${MANAGER_OVERRIDE_TTL_MINUTES:15}