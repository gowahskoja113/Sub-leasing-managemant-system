name: Deploy to VPS

# Chỉ chạy thủ công (tab Actions → Deploy to VPS → Run workflow).
# Cần các secret: VPS_HOST, VPS_USER, VPS_SSH_KEY (tuỳ chọn VPS_PORT).
on:
  workflow_dispatch:
    inputs:
      branch:
        description: Nhánh cần deploy
        required: true
        default: main
        type: choice
        options: [main, dev]

concurrency:
  group: deploy-vps
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Pull & rebuild on VPS
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        env:
          BRANCH: ${{ inputs.branch }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: BRANCH
          command_timeout: 25m
          script: |
            set -e
            cd /root/slms2026

            git fetch origin
            git checkout "$BRANCH"
            git pull --ff-only origin "$BRANCH"
            git log -1 --oneline

            docker build -t slms-api:latest .

            docker stop slms-api || true
            docker rm slms-api || true

            docker run -d \
              --name slms-api \
              --restart unless-stopped \
              --network slms-net \
              -p 127.0.0.1:8080:8080 \
              --env-file /root/slms-api.env \
              slms-api:latest

            sleep 5
            docker ps --filter name=slms-api
            docker logs --tail 40 slms-api
